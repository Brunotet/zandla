name: Render Hand-Draw Video
# Trigger-and-callback shape matching your EXISTING n8n convention
# (payload_b64 / render_id / callback_url) rather than inventing new
# field names — same async pattern as tongue-twisters, just conforming
# to the exact input shape your n8n HTTP Request node already sends.
on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Which channel's concept-library.json + voice to use"
        required: true
        type: string
      payload_b64:
        description: "Base64-encoded JSON: {script_text, beats, voice, presigned_put_url, public_video_url}"
        required: true
        type: string
      render_id:
        description: "n8n's ID for this render, echoed back in the callback body for correlation"
        required: true
        type: string
      callback_url:
        description: "n8n's Wait-node webhook URL — POSTed to when render finishes"
        required: true
        type: string
      skip_upload:
        description: "Skip R2 upload + n8n callback, just attach the rendered video as a downloadable Actions artifact instead. Use this for test renders before R2/n8n are wired up."
        required: false
        type: boolean
        default: true
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Cache apt packages (ffmpeg + Playwright OS deps)
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          # Static-ish key: these are OS-level packages (ffmpeg,
          # libnss3, libatk, etc.) that essentially never change
          # between runs unless Ubuntu's own package versions roll —
          # restore-keys below still gives a PARTIAL hit (skips
          # re-downloading whatever's already cached) even if the
          # exact key ever misses.
          key: apt-archives-${{ runner.os }}-v1
          restore-keys: |
            apt-archives-${{ runner.os }}-
      - name: Install dependencies
        run: |
          sudo apt-get update -y && sudo apt-get install -y ffmpeg
          pip install -r requirements.txt
      # ── CONFIRMED BUG, FIXED HERE (now belt-and-suspenders) ─────────
      # requirements.txt originally pinned "playwright" with NO
      # version — so `pip install` could silently resolve a NEWER
      # Playwright release on any given run without requirements.txt's
      # own text (and therefore its hash) ever changing. The old
      # browser-binary cache below was keyed on
      # hashFiles('requirements.txt') and decided BEFORE this install
      # step even ran — so it had no way to know the actually-resolved
      # Playwright version, and a real render failed with "Executable
      # doesn't exist... chromium_headless_shell-1243" because the
      # cache reported a "hit" against an OLDER cached browser build
      # that didn't match the NEWER Playwright version pip had just
      # silently picked up.
      # requirements.txt now pins playwright to an exact version
      # (==1.63.0), which is the PRIMARY fix — a real render's
      # Playwright version can no longer drift between runs at all.
      # The steps below (capturing the real installed version and
      # keying the browser cache on it, rather than on
      # requirements.txt's hash) are kept as a SECOND layer of
      # protection: if that pin is ever bumped, forgotten, or removed
      # later, this still self-heals instead of silently repeating the
      # exact same failure.
      - name: Resolve installed Playwright version
        id: pw-version
        run: |
          PW_VERSION=$(pip show playwright | grep -i '^Version:' | awk '{print $2}')
          if [ -z "$PW_VERSION" ]; then
            echo "Could not determine installed Playwright version from 'pip show playwright'" >&2
            exit 1
          fi
          echo "Resolved Playwright version: $PW_VERSION"
          echo "version=$PW_VERSION" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browser binaries
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          # Keyed on the ACTUAL resolved Playwright version (see
          # above), not requirements.txt's hash — a version bump,
          # silent or pinned, now always produces a fresh cache key
          # and a fresh matching browser download instead of a stale
          # "hit" against the wrong build.
          key: playwright-browsers-${{ runner.os }}-${{ steps.pw-version.outputs.version }}
      - name: Install Playwright Chromium (full download)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: playwright install --with-deps chromium
      - name: Install Playwright OS deps only (browser already cached)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: playwright install-deps chromium
      - name: Decode dispatch payload
        env:
          PAYLOAD_B64: ${{ inputs.payload_b64 }}
          RENDER_ID: ${{ inputs.render_id }}
          CALLBACK_URL: ${{ inputs.callback_url }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          python3 -c "
          import json, base64, os
          decoded = base64.b64decode(os.environ['PAYLOAD_B64']).decode('utf-8')
          d = json.loads(decoded)
          assert 'script_text' in d and 'beats' in d, 'payload_b64 decoded JSON missing script_text or beats'
          d['render_id'] = os.environ['RENDER_ID']
          d['callback_url'] = os.environ['CALLBACK_URL']
          d['channel'] = os.environ['CHANNEL']
          json.dump(d, open('/tmp/payload.json', 'w'))
          print(f\"ok — render_id={d['render_id']}, {len(d['beats'])} beats\")
          "
      - name: Build scene program + render
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          MODAL_TTS_URL: ${{ secrets.MODAL_TTS_URL }}
        run: |
          python3 tools/run_render.py \
            --channel "${{ inputs.channel }}" \
            --payload /tmp/payload.json \
            --out /tmp/output.mp4
      - name: Upload to R2 (presigned PUT, SigV4)
        if: ${{ inputs.skip_upload != true }}
        run: |
          python3 tools/upload_r2.py \
            --file /tmp/output.mp4 \
            --payload /tmp/payload.json
      - name: Callback to n8n
        if: ${{ inputs.skip_upload != true }}
        run: |
          python3 tools/resume_n8n.py --payload /tmp/payload.json
      - name: Attach rendered video as downloadable artifact (test mode)
        if: ${{ inputs.skip_upload == true }}
        uses: actions/upload-artifact@v4
        with:
          name: rendered-video
          path: /tmp/output.mp4
          retention-days: 7
