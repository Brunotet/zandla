name: Test Historical Sources

# Standalone smoke test — NOT the render pipeline. Triggered the same
# way you already trigger render.yml from n8n (workflow_dispatch via
# GitHub's API, same PAT), but this only calls
# historical_asset_resolver.py directly against real Commons/LOC/NASA/
# IA APIs and uploads whatever CLIP picked as a downloadable artifact.
# No R2 upload, no n8n callback, no video render — nothing here
# touches render.yml or any other channel's flow at all.

on:
  workflow_dispatch:
    inputs:
      queries:
        description: >
          Pipe-separated list of test phrases, e.g.
          "Amelia Earhart portrait 1928|Nikola Tesla laboratory|Apollo 11 moon landing".
          Leave blank to use the script's built-in default 4 phrases.
        required: false
        type: string
      presigned_put_url:
        description: >
          Presigned R2 PUT URL for the zipped results (from the same
          SigV4 presign logic your dispatch Code node already uses).
          If omitted, results only go to the GH Actions artifact.
        required: false
        type: string
      public_url:
        description: "The public pub-*.r2.dev URL matching presigned_put_url, just echoed into the log for convenience."
        required: false
        type: string

jobs:
  test-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt --break-system-packages

      - name: Run historical source test
        run: |
          if [ -n "${{ inputs.queries }}" ]; then
            IFS='|' read -ra PHRASES <<< "${{ inputs.queries }}"
            ARGS=()
            for p in "${PHRASES[@]}"; do ARGS+=(--query "$p"); done
            python3 tools/test_historical_sources.py "${ARGS[@]}"
          else
            python3 tools/test_historical_sources.py
          fi

      - name: Zip results
        run: |
          cd /tmp/historical_test && zip -r /tmp/historical_test_results.zip . && cd -

      - name: Upload zip to R2 (presigned PUT)
        if: ${{ inputs.presigned_put_url != '' }}
        run: |
          curl -sS -X PUT --upload-file /tmp/historical_test_results.zip "${{ inputs.presigned_put_url }}"
          echo "Uploaded — view at: ${{ inputs.public_url }}"

      - name: Upload picked images as artifact (always, as backup)
        uses: actions/upload-artifact@v4
        with:
          name: historical-test-results
          path: /tmp/historical_test/
          retention-days: 7
