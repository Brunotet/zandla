<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; background: #f7f4ed; overflow: hidden; }
  #stage { position: relative; }
  #world { width: 100%; height: 100%; display: block; }
  .drawable-path { fill: none; stroke: #1a1a1a; stroke-linecap: round; stroke-linejoin: round; }
  .illustration-img { }
  /* Fixed UI layer — deliberately OUTSIDE #world, never touched by camera
     moves (including the new pen-tracking zoom above — this stays at a
     fixed screen position regardless of where that tracking camera is
     currently framed, which is what keeps it reliably BELOW the hand's
     drawing area rather than fighting for the same space). */
  #caption-layer { position: absolute; bottom: 6%; left: 5%; right: 5%; text-align: center;
                   font-family: sans-serif; font-size: 40px; line-height: 1.3; color: #1a1a1a; font-weight: 700;
                   text-shadow: -2px -2px 0 #fff, 2px -2px 0 #fff, -2px 2px 0 #fff, 2px 2px 0 #fff,
                                0 0 14px rgba(255,255,255,0.95), 0 0 14px rgba(255,255,255,0.95);
                   pointer-events: none; white-space: pre-wrap; }
</style>
</head>
<body>
  <div id="stage">
    <svg id="world" xmlns="http://www.w3.org/2000/svg">
      <g id="content-layer"></g>
      <!-- Hand lives INSIDE the SVG's world-space coordinate system, same
           as text/icon paths, so it automatically pans/zooms correctly
           with the camera's viewBox — this is what was missing before:
           the hand was a separate HTML div in raw screen pixels, which
           never accounted for the camera transform at all. -->
      <g id="hand-layer"></g>
    </svg>
    <div id="caption-layer"></div>
    <!-- Screen-space, NOT inside the SVG world — a camera-transition
         swipe hand needs to read as a constant on-screen size and
         speed regardless of how zoomed-in the world viewBox currently
         is, the same reason caption-layer sits out here. -->
    <div id="transition-layer" style="position:absolute; inset:0; overflow:hidden; pointer-events:none;"></div>
  </div>

  <script src="vendor/js/gsap.min.js"></script>
  <script>
  // ── Load scene program ──────────────────────────────────────────
  // Scene data is injected directly as window.__SCENE_DATA__ (see
  // tools/run_render.py's page.add_init_script) rather than fetched —
  // fetching a file:// path from a file:// page hits Chromium's
  // cross-directory file-access sandboxing and fails silently, which
  // is exactly what caused the first real test render to produce a
  // blank canvas (audio-only output). Falls back to the old fetch
  // path only for convenience when manually testing this file via a
  // real HTTP server (python3 -m http.server) with ?scene=<url>.
  async function loadScene() {
    if (window.__SCENE_DATA__) {
      return window.__SCENE_DATA__;
    }
    const params = new URLSearchParams(window.location.search);
    const scenePath = params.get('scene');
    const resp = await fetch(scenePath);
    return resp.json();
  }

  const worldEl = document.getElementById('world');
  const contentLayer = document.getElementById('content-layer');
  const handLayer = document.getElementById('hand-layer');
  const captionLayer = document.getElementById('caption-layer');
  let FRAME_W = 1920, FRAME_H = 1080; // set from scene.frame at boot, used to center the swipe hand
  const transitionLayer = document.getElementById('transition-layer');

  // ── Camera: drives the SVG viewBox directly, see camera.py for why ──
  //
  // NEW: pen-tip tracking layer, added on top of the existing
  // keyframe camera below — nothing about the keyframe system itself
  // changes. Previously the keyframe tween wrote straight to the
  // viewBox attribute every frame. Now it writes into `baseCam`
  // instead, and a second per-frame pass (applyCameraFrame) blends
  // baseCam with a tighter, pen-following view whenever a stroke is
  // actively being drawn — then eases back to exactly baseCam the
  // instant drawing stops. If nothing is ever tracked (tracking
  // never engages), applyCameraFrame reduces to "just show baseCam",
  // which is byte-for-byte the old behavior.
  //
  // This only activates for stroke-reveals (icon paths, handwritten
  // words) — see traceHandCallback below — never for mask_wipe image
  // reveals, since there's no pen tip to follow there.
  const TRACK_ZOOM = 0.72;            // fraction of the base view's current size to zoom to while
                                       // tracking (0.72 ≈ a mild, noticeable-but-not-aggressive zoom).
                                       // 1.0 would mean no zoom at all; smaller = tighter. This is
                                       // the one number to change if the zoom ever feels too shallow
                                       // or too tight — everything else scales off it automatically.
  const TRACK_FOLLOW_SMOOTH = 0.20;   // 0-1: how much the tracked center catches up to the REAL,
                                       // live pen-tip position, calibrated at a 60fps reference rate
                                       // (see applyCameraFrame below — actual smoothing is now
                                       // frame-rate-independent, so this number means the same thing
                                       // regardless of the real tick rate). Lower = smoother/laggier
                                       // (better for fast, jittery pen motion); higher = snappier but
                                       // more prone to reading as shaky.
  const TRACK_ENGAGE_SMOOTH = 0.14;   // 0-1: how fast the ZOOM AMOUNT itself eases in when a stroke
                                       // starts and back out when it ends — this is what makes the
                                       // zoom-in/zoom-out feel like a deliberate camera move instead
                                       // of an instant cut. Same 60fps-reference-rate note as above.

  const baseCam = { x: 0, y: 0, w: 1920, h: 1080 }; // driven by the keyframe timeline below, unchanged in spirit
  const track = {
    active: false,     // true for every frame a stroke is actively being traced
    engage: 0,         // 0 = fully on baseCam, 1 = fully on the tight tracked view — eased, not stepped
    x: 0, y: 0,         // SMOOTHED tracked center, world-space — only ever updated inside applyCameraFrame
    rawX: 0, rawY: 0,   // the actual, unsmoothed live pen-tip position, updated instantly by setPenTrackTarget
    hasTarget: false,  // false right after a release, so the FIRST point of a new stroke snaps
                        // straight there instead of smooth-following in from wherever the last
                        // stroke ended (which could be a completely different part of the board).
  };

  function setPenTrackTarget(x, y) {
    track.active = true;
    track.rawX = x;
    track.rawY = y;
    if (!track.hasTarget) {
      // First point of a fresh stroke — snap the smoothed center
      // straight there rather than easing in from wherever tracking
      // last left off, which could be a totally different part of
      // the board (see the engage/follow smoothing note above).
      track.x = x;
      track.y = y;
      track.hasTarget = true;
    }
    // Actual smoothing toward (rawX, rawY) happens once per rendered
    // frame in applyCameraFrame, not here — this function can be
    // called multiple times between frames (or even zero times, if a
    // stroke pauses), so smoothing has to live in the ticker, which
    // has a real, measured deltaTime, to stay frame-rate-independent.
  }

  function releasePenTrackTarget() {
    track.active = false;
    track.hasTarget = false;
  }

  function applyCameraFrame(time, deltaTime) {
    // FRAME-RATE-INDEPENDENT SMOOTHING: the original version applied
    // TRACK_FOLLOW_SMOOTH/TRACK_ENGAGE_SMOOTH as flat per-frame
    // fractions, which silently assumes a constant ~60fps tick rate —
    // if the actual render environment ticks at a different or
    // uneven rate, the SAME constant ends up applying more or less
    // smoothing than intended. Converting each constant into a decay
    // rate (via Math.pow) and applying it against the REAL elapsed
    // time (deltaTime, from GSAP's own ticker) makes the smoothing
    // amount consistent regardless of tick rate — same visual result
    // whether frames arrive every 16ms or every 33ms.
    const dtSeconds = Math.max(0.001, (deltaTime || 16.7) / 1000);
    const followAlpha = 1 - Math.pow(1 - TRACK_FOLLOW_SMOOTH, dtSeconds * 60);
    const engageAlpha = 1 - Math.pow(1 - TRACK_ENGAGE_SMOOTH, dtSeconds * 60);

    if (track.hasTarget) {
      track.x += (track.rawX - track.x) * followAlpha;
      track.y += (track.rawY - track.y) * followAlpha;
    }

    const goal = track.active ? 1 : 0;
    track.engage += (goal - track.engage) * engageAlpha;
    if (Math.abs(track.engage - goal) < 0.001) track.engage = goal;

    let view = baseCam;
    if (track.engage > 0.001) {
      const tw = baseCam.w * TRACK_ZOOM;
      const th = baseCam.h * TRACK_ZOOM;
      const tx = track.x - tw / 2;
      const ty = track.y - th / 2;
      // Blend baseCam -> tracked rect by `engage`, not a hard swap —
      // this is what makes both the zoom-in AND the pen-following
      // itself read as one continuous, smooth camera move rather than
      // snapping to a new rectangle every frame.
      view = {
        x: baseCam.x + (tx - baseCam.x) * track.engage,
        y: baseCam.y + (ty - baseCam.y) * track.engage,
        w: baseCam.w + (tw - baseCam.w) * track.engage,
        h: baseCam.h + (th - baseCam.h) * track.engage,
      };
    }
    worldEl.setAttribute('viewBox', `${view.x} ${view.y} ${view.w} ${view.h}`);
  }

  // Runs every rendered frame, for the lifetime of the page — same
  // rAF-backed clock GSAP's own tweens already use, so this stays in
  // perfect lockstep with the keyframe camera and every stroke tween.
  // GSAP passes (time, deltaTime, frame) to ticker callbacks —
  // deltaTime (ms since the previous tick) is what makes the
  // smoothing above frame-rate-independent.
  gsap.ticker.add(applyCameraFrame);

  function buildCameraTimeline(keyframes) {
    if (!keyframes || keyframes.length === 0) return;
    baseCam.x = keyframes[0].x;
    baseCam.y = keyframes[0].y;
    baseCam.w = keyframes[0].w;
    baseCam.h = keyframes[0].h;
    applyCameraFrame(); // paint the very first frame immediately, don't wait for the next tick
    for (let i = 1; i < keyframes.length; i++) {
      const kf = keyframes[i];
      // Each move is scheduled at its OWN t_start (via delay), not
      // chained off the previous move's arrival — this is the actual
      // fix for the camera drifting toward the next region while the
      // current sentence was still being written. Between moves GSAP
      // simply leaves `baseCam` at its last-set value, which is the
      // hold behavior we want with zero extra code.
      //
      // NOTE: this tween now writes into baseCam only — it no longer
      // touches the viewBox directly. applyCameraFrame (above) is the
      // single place that ever sets the viewBox, so the keyframe
      // camera and the pen-tracking layer can never fight over it.
      gsap.to(baseCam, {
        x: kf.x, y: kf.y, w: kf.w, h: kf.h,
        duration: Math.max(0.01, kf.t_end - kf.t_start),
        delay: kf.t_start,
        ease: kf.ease === 'none' ? 'none' : kf.ease,
      });
    }
  }

  // ── Stroke-reveal drawing (write/draw modes) ────────────────────
  // subpaths come pre-computed from Python — text_to_path.py (real
  // glyph outlines, deterministic) for 'write' beats, svg_to_path.py
  // (extracted + fitted icon paths) for 'draw' beats with
  // draw_style='stroke_reveal'. Nothing generative happens here;
  // this just reveals a path that already fully exists.
  function animateStrokeReveal(beat, onUpdateHand) {
    if (!beat.subpaths || beat.subpaths.length === 0) {
      console.warn(`beat ${beat.beat_id}: no subpaths, skipping stroke reveal`);
      return;
    }

    // CONFIRMED via isolated test: stroke-dasharray/dashoffset restarts
    // at every disconnected subpath (every new "M" command) — a single
    // dasharray pair cannot progressively reveal a multi-stroke path,
    // each subpath would render fully solid immediately regardless of
    // offset. Each subpath gets its OWN <path> element and its own
    // dasharray/dashoffset, animated in SEQUENCE. This is also what
    // makes both icons AND text (as of the Hershey single-stroke font
    // switch — see text_to_path.py) read as genuine drawing: a hand
    // actually traces one real stroke, then the next, following each
    // stroke's real curve — not a synthetic wipe with no relationship
    // to the letter shapes.
    // Icon beats get their paths parented under a stable <g id="icon-...">
    // instead of straight into contentLayer. This grouping isn't
    // targeted by anything anymore (the icon-enlarge pinch effect that
    // used to reference it was removed), but it's harmless structure
    // to keep — cheap insurance for anything that wants to address a
    // specific icon's group later. Text (write mode) beats have no
    // icon_group_id and just append to contentLayer directly, unaffected.
    let parent = contentLayer;
    if (beat.icon_group_id) {
      parent = document.getElementById(beat.icon_group_id);
      if (!parent) {
        parent = document.createElementNS('http://www.w3.org/2000/svg', 'g');
        parent.id = beat.icon_group_id;
        contentLayer.appendChild(parent);
      }
    }

    const pathEls = beat.subpaths.map((d) => {
      const el = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      el.setAttribute('d', d);
      el.setAttribute('class', 'drawable-path');
      // Explicit per-beat stroke width, computed in Python (see
      // render_pipeline.py) — different formula for text (proportional
      // to font_size) vs icons (compensating for their scale
      // transform), since a single fixed width was wrong for both at
      // once. Falls back to 4 only if somehow missing.
      el.style.strokeWidth = beat.stroke_width || 4;
      if (beat.path_transform) {
        el.setAttribute('transform', beat.path_transform);
      }
      parent.appendChild(el);
      return el;
    });

    const lens = pathEls.map((el) => el.getTotalLength());
    pathEls.forEach((el, i) => {
      el.style.strokeDasharray = lens[i];
      el.style.strokeDashoffset = lens[i];
    });

    // Two timing modes:
    // 1. Real per-segment durations/delays from render_pipeline.py
    //    (write-mode text, computed from actual Chatterbox word
    //    timestamps — each stroke plays at the moment it's actually
    //    spoken, not a generic split).
    // 2. Length-proportional fallback (icons — no speech timing to
    //    anchor to, so a longer stroke reasonably gets more time than
    //    a short tick mark).
    const hasRealTiming = beat.segment_durations && beat.segment_delays;
    const totalLen = lens.reduce((a, b) => a + b, 0) || 1;
    // Real Chatterbox speech for a short icon-beat line can be well
    // under a second — technically still sequential, but too fast for
    // a human to actually perceive as "drawing" rather than "flashing
    // in". Icons don't need millisecond-precise lockstep with speech
    // the way word-level text does, so clamp to a minimum that's
    // actually watchable.
    // FIXED: was Math.max(beat_duration, min_reveal_duration) — took
    // whichever was BIGGER, so whenever the sentence's narration ran
    // longer than min_reveal_duration (nearly always), the icon got
    // STRETCHED to draw across the ENTIRE sentence instead of
    // finishing quickly and then just sitting there fully drawn. That
    // was both why drawing looked slow AND why the icon was still
    // actively revealing right up until the swipe fired — zero
    // buffer, because "finish" and "beat end" were the same instant.
    // min_reveal_duration is now used directly as a fast, fixed
    // target (falling back to the full span only if genuinely absent).
    const totalDuration = beat.min_reveal_duration || Math.max(beat.end - beat.start, 0.3);
    const tl = gsap.timeline({ delay: beat.start });

    pathEls.forEach((el, i) => {
      const segDuration = hasRealTiming
        ? Math.max(0.03, beat.segment_durations[i])
        : Math.max(0.05, totalDuration * (lens[i] / totalLen));
      const position = hasRealTiming ? beat.segment_delays[i] : undefined;

      tl.to(el.style, {
        strokeDashoffset: 0,
        duration: segDuration,
        ease: 'none',
        onUpdate: function () {
          const progress = this.progress();
          const pt = el.getPointAtLength(progress * lens[i]);
          // BUG FIXED: was pt.matrixTransform(ctm) — getCTM() gives
          // viewport-pixel coordinates, not world-space board
          // coordinates (confirmed with an actual browser test), so
          // this used to break the instant the camera zoomed at all.
          // Direct algebra using the same offset/scale Python already
          // computed for path_transform — correct at any zoom level,
          // no dependency on viewport pixels whatsoever.
          const worldX = beat.path_offset_x !== undefined
            ? beat.path_offset_x + pt.x * beat.path_scale
            : pt.x;
          const worldY = beat.path_offset_y !== undefined
            ? beat.path_offset_y + pt.y * beat.path_scale
            : pt.y;
          // No rotation — hand stays upright regardless of path curvature.
          onUpdateHand(worldX, worldY, 0);
        },
        onComplete: beat.icon_group_id ? function () {
          // PROVEN via an actual browser test (not assumed) that this
          // exact order is required: clear the dash values FIRST, THEN
          // add non-scaling-stroke. Doing it in the other order (or
          // having both active at once, which is what the reveal
          // itself needs) permanently corrupts the stroke into a
          // dashed pattern — confirmed with screenshots before writing
          // this. Applied after the reveal is done so the dasharray
          // animation itself is never disturbed mid-stroke.
          el.style.strokeDasharray = '';
          el.style.strokeDashoffset = '';
          // BUG FIXED: switching to non-scaling-stroke without ALSO
          // updating the width value meant the same number rendered in
          // a different coordinate space — much thinner. This is the
          // exact "thick while drawing, thin right after" bug. Applied
          // at the same instant as the vector-effect change, so there's
          // no visible jump between the two states.
          if (beat.stroke_width_final) {
            el.style.strokeWidth = beat.stroke_width_final;
          }
          el.setAttribute('vector-effect', 'non-scaling-stroke');
        } : undefined,
      }, position);
    });

    // FIXED: the hand used to just sit at its last position once the
    // reveal finished, visible and unmoving, until the NEXT swipe (or
    // nothing) eventually hid it — reported as "freezing there for a
    // few ms" (in practice, up to the full buffer window). Now hides
    // immediately the instant this beat's own reveal is fully done.
    tl.eventCallback('onComplete', () => {
      const activeHand = document.getElementById('active-hand');
      if (activeHand) activeHand.style.display = 'none';
      // Camera stops tracking the instant the hand disappears — this
      // is what makes the zoom ease back out to the normal view the
      // moment a stroke finishes, per the pen-tracking feature above.
      releasePenTrackTarget();
    });
  }

  // ── Natural jitter ────────────────────────────────────────────────
  // Layered sine waves, not random noise — random jitter looks like
  // static/shaking, whereas real handwriting has small, semi-rhythmic
  // wobble (the hand pausing/adjusting/lifting slightly between
  // letters or strokes). Amplitude is PROPORTIONAL TO HAND SIZE, not a
  // fixed constant — a fixed few-world-units wobble was imperceptible
  // once the hand's actual size scaled up, which is why it looked like
  // a flat robotic slide instead of writing. Passing handHeight makes
  // this scale correctly whether the hand is small (icon) or large
  // (full-sentence write).
  function naturalJitter(t, handHeight) {
    // Reduced from 0.16/0.09 — jitter scales WITH hand size, and hand
    // size was increased since this was tuned, so the same ratio was
    // producing a bigger absolute swing than intended, throwing the
    // pen tip visibly off the actual letter. Smaller ratio keeps the
    // tip precisely glued to real ink while still reading as alive,
    // not perfectly robotic.
    const ampY = handHeight * 0.05;
    const ampX = handHeight * 0.03;
    return {
      dx: Math.sin(t * 5.4) * ampX + Math.sin(t * 11.3) * ampX * 0.4,
      dy: Math.sin(t * 3.7 + 1.0) * ampY + Math.sin(t * 8.6) * ampY * 0.35,
    };
  }

  // ── Shared stroke-tracing callback ──────────────────────────────
  // Every stroke-reveal call site (single draw/write, icon_word's
  // icon+label, each row of a multi-row listicle item, and the
  // erase+relabel rewrite) used to hand-roll the same three lines:
  // compute jitter, place the hand sprite, done. Centralizing it here
  // means the pen-tracking camera hook (setPenTrackTarget) only has
  // to be added in ONE place to cover every one of those cases —
  // including every row of a multi-row icon_word beat, automatically.
  //
  // Feeds the tracker the RAW pen-tip point (px, py), not the
  // jittered sprite position — jitter is a cosmetic hand wobble, not
  // a real change in where the ink is landing, and tracking the
  // jitter would make the CAMERA shake instead of just the hand.
  function traceHandCallback(h) {
    return (px, py, angle) => {
      const j = naturalJitter(performance.now() / 1000, h.h);
      placeHandSprite(h.file, px + j.dx - h.anchor_x, py + j.dy - h.anchor_y, h.w, h.h, 0, px + j.dx, py + j.dy);
      setPenTrackTarget(px, py);
    };
  }

  // ── Hand placement ───────────────────────────────────────────────
  // SVG <image>, not HTML <img> — lives in the same world-space
  // coordinate system as text/icon paths, so it inherits the camera's
  // viewBox transform automatically. x/y/w/h are all world-space units
  // here, exactly like every other piece of content on the board.
  //
  // pivotX/pivotY = the ANCHOR's actual world position (the pen tip's
  // target point), NOT the image's top-left corner. Rotating around
  // the top-left corner would make the tip drift away from the target
  // as the angle changes — rotation has to pivot around the same point
  // the anchor offset was computed to land on.
  function placeHandSprite(file, x, y, w, h, rotation, pivotX, pivotY) {
    let img = document.getElementById('active-hand');
    if (!img) {
      img = document.createElementNS('http://www.w3.org/2000/svg', 'image');
      img.id = 'active-hand';
      img.setAttribute('href', `assets/hands/${file}`);
      handLayer.appendChild(img);
    }
    const currentHref = img.getAttribute('href');
    if (!currentHref || !currentHref.endsWith(file)) {
      img.setAttribute('href', `assets/hands/${file}`);
    }
    img.style.display = '';
    img.setAttribute('x', x);
    img.setAttribute('y', y);
    img.setAttribute('width', w);
    img.setAttribute('height', h);
    const px = pivotX !== undefined ? pivotX : x;
    const py = pivotY !== undefined ? pivotY : y;
    img.setAttribute('transform', `rotate(${rotation}, ${px}, ${py})`);
  }

  // ── Illustration reveal (mask_wipe — no stroke path, CLIP-matched
  // stock illustration instead. See asset_resolver.py fallback tier.) ──
  function animateMaskWipe(cfg) {
    const region = cfg.illustration_region || cfg.region;
    const start = cfg.illustration_start !== undefined ? cfg.illustration_start : cfg.start;
    const end = cfg.illustration_end !== undefined ? cfg.illustration_end : cfg.end;
    const duration = Math.max(0.05, end - start);

    // POP-IN reveal — used for real historical photos (asset_type
    // "photo" on the history channel — see render_pipeline.py's
    // _illustration_reveal). No hand at all: a hand pretending to
    // "draw" a real photograph into existence reads as an obvious
    // fake, since nothing is actually being drawn. Just a quick
    // fade+scale so the photo arrives cleanly instead.
    if (cfg.illustration_reveal === 'pop' || !cfg.mask_wipe_hand) {
      const img = document.createElementNS('http://www.w3.org/2000/svg', 'image');
      img.setAttribute('x', region.x);
      img.setAttribute('y', region.y);
      img.setAttribute('width', region.w);
      img.setAttribute('height', region.h);
      img.setAttribute('href', cfg.illustration_path);
      img.style.opacity = '0';
      const cx = region.x + region.w / 2, cy = region.y + region.h / 2;
      const scaleState = { s: 0.9 };
      img.setAttribute('transform', `translate(${cx},${cy}) scale(${scaleState.s}) translate(${-cx},${-cy})`);
      contentLayer.appendChild(img);

      const popDuration = Math.min(0.5, Math.max(0.25, duration));
      const tl = gsap.timeline({ delay: start });
      tl.to(img.style, { opacity: 1, duration: popDuration, ease: 'power2.out' }, 0);
      tl.to(scaleState, {
        s: 1.0, duration: popDuration, ease: 'back.out(1.6)',
        onUpdate: () => {
          img.setAttribute('transform', `translate(${cx},${cy}) scale(${scaleState.s}) translate(${-cx},${-cy})`);
        },
      }, 0);
      return;
    }

    const clipId = `clip-${cfg.beat_id}`;
    const clip = document.createElementNS('http://www.w3.org/2000/svg', 'clipPath');
    clip.setAttribute('id', clipId);
    const clipRect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
    clipRect.setAttribute('x', region.x);
    clipRect.setAttribute('y', region.y);
    clipRect.setAttribute('width', 0);
    clipRect.setAttribute('height', region.h);
    clip.appendChild(clipRect);
    contentLayer.appendChild(clip);

    const img = document.createElementNS('http://www.w3.org/2000/svg', 'image');
    img.setAttribute('x', region.x);
    img.setAttribute('y', region.y);
    img.setAttribute('width', region.w);
    img.setAttribute('height', region.h);
    img.setAttribute('href', cfg.illustration_path);
    img.setAttribute('clip-path', `url(#${clipId})`);
    contentLayer.appendChild(img);

    // FIXED: mask_wipe illustrations previously had NO hand at all —
    // confirmed bug (an icon just fading/wiping in with nothing
    // 'drawing' it). A 'drag' gesture now tracks the reveal edge, so
    // it reads as a hand bringing the image into view.
    const h = cfg.mask_wipe_hand;
    gsap.to(clipRect, {
      attr: { width: region.w },
      duration,
      delay: start,
      ease: 'power1.out',
      onUpdate: h ? function () {
        const w = parseFloat(clipRect.getAttribute('width')) || 0;
        const px = region.x + w;
        const py = region.y + region.h / 2;
        const j = naturalJitter(performance.now() / 1000, h.h);
        placeHandSprite(h.file, px + j.dx - h.anchor_x, py + j.dy - h.anchor_y, h.w, h.h, 0, px + j.dx, py + j.dy);
      } : undefined,
    });
  }

  // ── Swipe hand — full-board clear OR a camera-transition cut ─────
  // Screen-space (transitionLayer), not SVG world-space — a
  // camera-transition swipe needs to read at a constant size/speed
  // regardless of current zoom, same reasoning as caption-layer.
  function animateSweepHand(sweep) {
    const img = document.createElement('img');
    img.src = `assets/hands/${sweep.file}`;
    img.style.position = 'absolute';
    img.style.width = `${sweep.w}px`;
    img.style.height = `${sweep.h}px`;
    if (sweep.mirror) img.style.transform = 'scaleX(-1)';
    transitionLayer.appendChild(img);

    const duration = Math.max(0.1, sweep.duration);
    const startDelay = Math.max(0, sweep.start);

    // ONE HAND AT A TIME (confirmed bug, and a second one underneath
    // it): the lookup for #active-hand was done SYNCHRONOUSLY here,
    // at boot/scheduling time — but the hand element is created
    // LAZILY on its first actual placement, which itself only happens
    // later via a delayed callback. At boot time it usually doesn't
    // exist yet, so this captured `null` and the hide logic silently
    // did nothing the entire time. Lookup now happens INSIDE each
    // delayed callback, at the moment it actually runs. The
    // "restore visibility after the swipe" call that used to be here
    // is gone — placeHandSprite already un-hides the hand the moment
    // it's actually needed again for real content, and restoring it
    // right after the swipe (with nothing yet drawn) could flash a
    // stale hand sitting at its old position.
    gsap.delayedCall(startDelay, () => {
      const activeHand = document.getElementById('active-hand');
      if (activeHand) activeHand.style.display = 'none';
    });

    // STUCK/FROZEN HAND BUG, CONFIRMED: this img element was created
    // and made visible IMMEDIATELY when this function ran (at boot,
    // synchronously, for every beat at once) — but its actual motion
    // doesn't start until `delay` elapses, which could be seconds or
    // even most of the video away. That's exactly what "a hand just
    // sitting there unmoving for a long stretch" looks like: it WAS
    // visible the whole time, just not yet animating. Hidden until
    // the instant its own tween actually starts.
    img.style.opacity = '0';

    if (sweep.axis === 'y') {
      // BUG FIXED: sweep.x was never set here (only sweep.anchor_x,
      // the raw internal anchor offset), so it wasn't actually
      // centered on the frame — same class of bug as the y case below.
      img.style.left = `${FRAME_W / 2 - (sweep.anchor_x !== undefined ? sweep.anchor_x : sweep.w / 2)}px`;
      img.style.top = `${sweep.start_y}px`;
      gsap.to(img.style, {
        top: `${sweep.end_y}px`,
        duration, delay: startDelay,
        ease: 'power1.inOut',
        onStart: () => { img.style.opacity = '1'; },
        onComplete: () => img.remove(),
      });
    } else {
      // BUG FIXED: sweep.y was never set by the camera-transition path
      // (only the full-board 'swipe' mode set it) — silently defaulted
      // to 0, i.e. the TOP of the screen, instead of being centered
      // where the writing/content actually is.
      img.style.top = `${FRAME_H / 2 - (sweep.anchor_y !== undefined ? sweep.anchor_y : sweep.h / 2)}px`;
      img.style.left = `${sweep.start_x}px`;
      gsap.to(img.style, {
        left: `${sweep.end_x}px`,
        duration, delay: startDelay,
        ease: 'power1.inOut',
        onStart: () => { img.style.opacity = '1'; },
        onComplete: () => img.remove(),
      });
    }
  }

  // ── Beat dispatch ─────────────────────────────────────────────────
  function scheduleBeat(beat) {
    if (beat.mode === 'icon_word' && beat.sub_visuals && beat.hand) {
      // 'food' icon + written word 'good' sharing one beat/region —
      // both sub-visuals reuse the exact same stroke-reveal renderer
      // draw/write already use, just called twice with the same
      // hand so it reads as one continuous gesture.
      const h = beat.hand;
      if (beat.illustration_path && beat.illustration_region) {
        animateMaskWipe(beat);
      }
      // Multi-item (2-4 icons/words) mask_wipe fallback — parallel,
      // additive array, doesn't touch the single-illustration case above.
      if (beat.illustration_items) {
        beat.illustration_items.forEach((illus) => animateMaskWipe(illus));
      }
      beat.sub_visuals.forEach((sub) => {
        animateStrokeReveal(sub, traceHandCallback(h));
      });
      return;
    }
    if (beat.mode === 'draw' && beat.illustration_path) {
      animateMaskWipe(beat);
      return;
    }
    if ((beat.mode === 'write' || beat.mode === 'draw') && beat.region && beat.hand && beat.subpaths) {
      // Both text (real Hershey pen strokes) and icons now use the
      // SAME proven stroke-reveal renderer — one technique, one place
      // for a bug to hide, not two separate hacks to keep in sync.
      const h = beat.hand;
      animateStrokeReveal(beat, traceHandCallback(h));
    } else if (beat.mode === 'draw' && beat.illustration_path) {
      animateMaskWipe(beat);
    } else if (beat.mode === 'swipe' && beat.hand_sweep) {
      // FIXED: this was never actually dispatched before — swipe mode
      // set hand_sweep data but nothing in the template ever read it.
      animateSweepHand(beat.hand_sweep);
    }
    // 'zoom_in'/'zoom_out' beats need no dispatch here at all — they're
    // now a pure camera move (see render_pipeline.py), driven entirely
    // by scheduleCameraTransition below and the keyframe timeline. No
    // hand ever appears for them.
  }

  // Camera-transition swipe hand fires on ANY beat that got one
  // (see render_pipeline.py's _apply_camera_move) — independent of
  // beat.mode, since it's about the CAMERA CUT into this beat, not
  // the beat's own drawing action. Runs alongside whatever else
  // scheduleBeat above does for this beat.
  function scheduleCameraTransition(beat) {
    if (beat.camera_transition) {
      animateSweepHand(beat.camera_transition);
    }
  }

  // ── Subtitles (history channel only — scene.subtitles is absent/empty
  // for every other channel, see render_pipeline.py's _build_subtitle_cues) ──
  // Cues use the SAME real per-word Chatterbox timestamps that already
  // drive pen-stroke sync elsewhere, chunked into short readable groups
  // within a single beat (never straddling two sentences). Fully
  // independent of the pen-tracking camera above — captions live in
  // screen-space (#caption-layer), the tracking camera only ever
  // affects the SVG world-space viewBox.
  function scheduleSubtitles(subtitles) {
    if (!subtitles || subtitles.length === 0) return;
    subtitles.forEach((cue, i) => {
      gsap.delayedCall(cue.start, () => {
        captionLayer.textContent = cue.text;
      });
      // Only explicitly clear on a REAL gap before the next cue (or if
      // this is the last cue) — for back-to-back cues, the next cue's
      // own delayedCall overwrites the text at the right moment, which
      // avoids any race between a "clear" and a "set" landing at the
      // same timestamp.
      const next = subtitles[i + 1];
      const hasGapAfter = !next || next.start > cue.end + 0.02;
      if (hasGapAfter) {
        gsap.delayedCall(cue.end, () => {
          captionLayer.textContent = '';
        });
      }
    });
  }

  // ── Boot ────────────────────────────────────────────────────────
  loadScene().then((scene) => {
    console.log(`scene loaded: ${scene.beats.length} beats, orientation=${scene.orientation || 'landscape'}`);
    // Frame size comes from the scene program (render_pipeline.py's
    // orientation param), not a hardcoded 1920x1080 — this is what
    // makes portrait (Shorts/Reels) and other aspect ratios work
    // without touching this file at all.
    const fw = scene.frame ? scene.frame.width : 1920;
    const fh = scene.frame ? scene.frame.height : 1080;
    FRAME_W = fw;
    FRAME_H = fh;
    document.getElementById('stage').style.width = `${fw}px`;
    document.getElementById('stage').style.height = `${fh}px`;
    worldEl.setAttribute('viewBox', `0 0 ${fw} ${fh}`);

    buildCameraTimeline(scene.camera_keyframes);
    scene.beats.forEach(scheduleBeat);
    scene.beats.forEach(scheduleCameraTransition);
    scheduleSubtitles(scene.subtitles);
  }).catch((err) => {
    // Loud, not silent — this exact failure mode (fetch of a file://
    // path failing silently) is what produced a blank first render.
    console.error('FATAL: scene failed to load:', err);
    document.body.innerHTML = `<div style="color:red;font-size:40px;padding:40px;">SCENE LOAD FAILED: ${err}</div>`;
  });
  </script>
</body>
</html>
