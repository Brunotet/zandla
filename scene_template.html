<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; background: #f7f4ed; overflow: hidden; }
  #stage { position: relative; width: 1920px; height: 1080px; }
  #world { width: 100%; height: 100%; display: block; }
  .drawable-path { fill: none; stroke: #1a1a1a; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
  .text-fill-path { fill: #1a1a1a; stroke: none; }
  .illustration-img { }
  /* Fixed UI layer — deliberately OUTSIDE #world, never touched by camera moves */
  #caption-layer { position: absolute; bottom: 40px; left: 0; right: 0; text-align: center;
                   font-family: sans-serif; font-size: 42px; color: #1a1a1a; font-weight: 600;
                   text-shadow: -2px -2px 0 #fff, 2px -2px 0 #fff, -2px 2px 0 #fff, 2px 2px 0 #fff,
                                0 0 12px rgba(255,255,255,0.9);
                   pointer-events: none; }
</style>
</head>
<body>
  <div id="stage">
    <svg id="world" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
      <g id="content-layer"></g>
      <!-- Hand lives INSIDE the SVG's world-space coordinate system, same
           as text/icon paths, so it automatically pans/zooms correctly
           with the camera's viewBox — this is what was missing before:
           the hand was a separate HTML div in raw screen pixels, which
           never accounted for the camera transform at all. -->
      <g id="hand-layer"></g>
    </svg>
    <div id="caption-layer"></div>
  </div>

  <script src="vendor/js/gsap.min.js"></script>
  <script>
  // ── Load scene program ──────────────────────────────────────────
  // Scene data is injected directly as window.__SCENE_DATA__ (see
  // tools/run_render.py's page.add_init_script) rather than fetched —
  // fetching a file:// path from a file:// page hits Chromium's
  // cross-directory file-access sandboxing and fails silently, which
  // is exactly what caused the first real test render to produce a
  // blank canvas (audio-only output). Falls back to the old fetch
  // path only for convenience when manually testing this file via a
  // real HTTP server (python3 -m http.server) with ?scene=<url>.
  async function loadScene() {
    if (window.__SCENE_DATA__) {
      return window.__SCENE_DATA__;
    }
    const params = new URLSearchParams(window.location.search);
    const scenePath = params.get('scene');
    const resp = await fetch(scenePath);
    return resp.json();
  }

  const worldEl = document.getElementById('world');
  const contentLayer = document.getElementById('content-layer');
  const handLayer = document.getElementById('hand-layer');
  const captionLayer = document.getElementById('caption-layer');

  // ── Camera: drives the SVG viewBox directly, see camera.py for why ──
  function buildCameraTimeline(keyframes) {
    if (!keyframes || keyframes.length === 0) return;
    const cam = { x: keyframes[0].x, y: keyframes[0].y, w: keyframes[0].w, h: keyframes[0].h };
    const tl = gsap.timeline();
    for (let i = 1; i < keyframes.length; i++) {
      const kf = keyframes[i];
      const prev = keyframes[i - 1];
      tl.to(cam, {
        x: kf.x, y: kf.y, w: kf.w, h: kf.h,
        duration: kf.t - prev.t,
        ease: kf.ease === 'none' ? 'none' : kf.ease,
        onUpdate: () => {
          worldEl.setAttribute('viewBox', `${cam.x} ${cam.y} ${cam.w} ${cam.h}`);
        },
      }, prev.t);
    }
    return tl;
  }

  // ── Stroke-reveal drawing (write/draw modes) ────────────────────
  // path_d comes pre-computed from Python — text_to_path.py (real
  // glyph outlines, deterministic) for 'write' beats, svg_to_path.py
  // (extracted + fitted icon paths) for 'draw' beats with
  // draw_style='stroke_reveal'. Nothing generative happens here;
  // this just reveals a path that already fully exists.
  function animateStrokeReveal(beat, onUpdateHand) {
    if (!beat.path_d) {
      console.warn(`beat ${beat.beat_id}: no path_d, skipping stroke reveal`);
      return;
    }

    const pathEl = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    pathEl.setAttribute('d', beat.path_d);
    pathEl.setAttribute('class', 'drawable-path');
    if (beat.path_transform) {
      pathEl.setAttribute('transform', beat.path_transform);
    }
    contentLayer.appendChild(pathEl);

    // getTotalLength()/getPointAtLength() operate in the path's LOCAL
    // coordinate space — if a transform is applied (icon case), the
    // hand-tracking point needs the same transform applied to match
    // world-space. write-mode paths have no transform (already baked
    // into path_d by text_to_path.py), so this is a no-op for those.
    const ctm = beat.path_transform ? pathEl.getCTM() : null;

    const len = pathEl.getTotalLength();
    pathEl.style.strokeDasharray = len;
    pathEl.style.strokeDashoffset = len;

    const duration = beat.end - beat.start;
    gsap.to(pathEl.style, {
      strokeDashoffset: 0,
      duration,
      delay: beat.start,
      ease: 'none',
      onUpdate: function () {
        const progress = this.progress();
        let pt = pathEl.getPointAtLength(progress * len);
        let nextPt = pathEl.getPointAtLength(Math.min(progress + 0.02, 1) * len);
        if (ctm) {
          pt = pt.matrixTransform(ctm);
          nextPt = nextPt.matrixTransform(ctm);
        }
        const angle = Math.atan2(nextPt.y - pt.y, nextPt.x - pt.x) * 180 / Math.PI;
        onUpdateHand(pt.x, pt.y, angle);
      },
    });
  }

  // ── Text reveal (write mode) ─────────────────────────────────────
  // Font glyphs are FILLED shapes, not single-stroke lines — tracing
  // their outline with a thick stroke (the old approach) nearly merges
  // into a solid blob, and a sentence's glyph path has many
  // disconnected pieces (every letter, every hole like the inside of
  // an "o" or "e"), so stroke-reveal follows path DATA order, not
  // left-to-right, which is what made the hand look like it was
  // jumping around randomly. Filling the real letterforms (correct —
  // that's what makes the handwriting font look right) and revealing
  // via a left-to-right wipe fixes both problems: readable text, and
  // hand tracking a smooth linear sweep instead of erratic path order.
  function animateTextReveal(beat, onUpdateHand) {
    if (!beat.path_d || !beat.region) {
      console.warn(`beat ${beat.beat_id}: no path_d/region, skipping text reveal`);
      return;
    }
    const region = beat.region;

    const clipId = `text-clip-${beat.beat_id}`;
    const clip = document.createElementNS('http://www.w3.org/2000/svg', 'clipPath');
    clip.setAttribute('id', clipId);
    const clipRect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
    clipRect.setAttribute('x', region.x);
    clipRect.setAttribute('y', region.y);
    clipRect.setAttribute('width', 0);
    clipRect.setAttribute('height', region.h);
    clip.appendChild(clipRect);
    contentLayer.appendChild(clip);

    const pathEl = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    pathEl.setAttribute('d', beat.path_d);
    pathEl.setAttribute('class', 'text-fill-path');
    pathEl.setAttribute('clip-path', `url(#${clipId})`);
    contentLayer.appendChild(pathEl);

    const trackY = region.y + region.h / 2;
    const state = { width: 0 };

    if (beat.reveal_keyframes && beat.reveal_keyframes.length > 0) {
      // Real per-word Chatterbox timing — piecewise reveal that hits
      // each word's actual x-position at the moment it's actually
      // spoken, not a uniform slide across the whole sentence.
      const tl = gsap.timeline({ delay: beat.start });
      let prevT = 0;
      beat.reveal_keyframes.forEach((kf) => {
        const segDuration = Math.max(0.02, kf.t - prevT);
        const targetWidth = kf.x_end - region.x;
        tl.to(state, {
          width: targetWidth,
          duration: segDuration,
          ease: 'none',
          onUpdate: () => {
            clipRect.setAttribute('width', Math.max(0, state.width));
            onUpdateHand(region.x + state.width, trackY, 0);
          },
        }, prevT);
        prevT = kf.t;
      });
    } else {
      // Fallback: uniform-speed reveal (used only if word-count
      // mismatch was logged in render_pipeline.py for this beat).
      const duration = beat.end - beat.start;
      gsap.to(state, {
        width: region.w,
        duration,
        delay: beat.start,
        ease: 'none',
        onUpdate: () => {
          clipRect.setAttribute('width', Math.max(0, state.width));
          onUpdateHand(region.x + state.width, trackY, 0);
        },
      });
    }
  }

  // ── Hand placement ───────────────────────────────────────────────
  // SVG <image>, not HTML <img> — lives in the same world-space
  // coordinate system as text/icon paths, so it inherits the camera's
  // viewBox transform automatically. x/y/w/h are all world-space units
  // here, exactly like every other piece of content on the board.
  //
  // pivotX/pivotY = the ANCHOR's actual world position (the pen tip's
  // target point), NOT the image's top-left corner. Rotating around
  // the top-left corner would make the tip drift away from the target
  // as the angle changes — rotation has to pivot around the same point
  // the anchor offset was computed to land on.
  function placeHandSprite(file, x, y, w, h, rotation, pivotX, pivotY) {
    let img = document.getElementById('active-hand');
    if (!img) {
      img = document.createElementNS('http://www.w3.org/2000/svg', 'image');
      img.id = 'active-hand';
      img.setAttribute('href', `assets/hands/${file}`);
      handLayer.appendChild(img);
    }
    const currentHref = img.getAttribute('href');
    if (!currentHref || !currentHref.endsWith(file)) {
      img.setAttribute('href', `assets/hands/${file}`);
    }
    img.setAttribute('x', x);
    img.setAttribute('y', y);
    img.setAttribute('width', w);
    img.setAttribute('height', h);
    const px = pivotX !== undefined ? pivotX : x;
    const py = pivotY !== undefined ? pivotY : y;
    img.setAttribute('transform', `rotate(${rotation}, ${px}, ${py})`);
  }

  // ── Illustration reveal (mask_wipe — no stroke path, CLIP-matched
  // stock illustration instead. See asset_resolver.py fallback tier.) ──
  function animateMaskWipe(beat) {
    const region = beat.region;
    const clipId = `clip-${beat.beat_id}`;
    const clip = document.createElementNS('http://www.w3.org/2000/svg', 'clipPath');
    clip.setAttribute('id', clipId);
    const clipRect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
    clipRect.setAttribute('x', region.x);
    clipRect.setAttribute('y', region.y);
    clipRect.setAttribute('width', 0);
    clipRect.setAttribute('height', region.h);
    clip.appendChild(clipRect);
    contentLayer.appendChild(clip);

    const img = document.createElementNS('http://www.w3.org/2000/svg', 'image');
    img.setAttribute('x', region.x);
    img.setAttribute('y', region.y);
    img.setAttribute('width', region.w);
    img.setAttribute('height', region.h);
    img.setAttribute('href', beat.illustration_path);
    img.setAttribute('clip-path', `url(#${clipId})`);
    contentLayer.appendChild(img);

    gsap.to(clipRect, {
      attr: { width: region.w },
      duration: beat.end - beat.start,
      delay: beat.start,
      ease: 'power1.out',
    });
  }

  // ── Beat dispatch ─────────────────────────────────────────────────
  function scheduleBeat(beat) {
    if (beat.mode === 'draw' && beat.illustration_path) {
      animateMaskWipe(beat);
      return;
    }
    if (beat.mode === 'write' && beat.region && beat.hand && beat.path_d) {
      // Text: filled glyph shapes revealed via left-to-right wipe (see
      // animateTextReveal docstring for why this replaced stroke-reveal).
      const h = beat.hand;
      animateTextReveal(beat, (px, py, angle) => {
        placeHandSprite(h.file, px - h.anchor_x, py - h.anchor_y, h.w, h.h, angle, px, py);
      });
    } else if (beat.mode === 'draw' && beat.region && beat.hand && beat.path_d) {
      // Icons: real single/multi-stroke line paths, stroke-reveal is the
      // correct technique here (unlike text).
      const h = beat.hand;
      animateStrokeReveal(beat, (px, py, angle) => {
        placeHandSprite(h.file, px - h.anchor_x, py - h.anchor_y, h.w, h.h, angle, px, py);
      });
    } else if (beat.mode === 'point' && beat.hand) {
      gsap.set({}, {
        delay: beat.start,
        onComplete: () => placeHandSprite(beat.hand.file, beat.hand.x, beat.hand.y, beat.hand.w, beat.hand.h, 0),
      });
    } else if ((beat.mode === 'zoom_in' || beat.mode === 'zoom_out') && beat.hand_swap) {
      const { start, end, swap_at } = beat.hand_swap;
      gsap.set({}, { delay: start.x !== undefined ? beat.start : 0 });
      gsap.delayedCall(beat.start, () =>
        placeHandSprite(start.file, start.x, start.y, start.w, start.h, 0));
      gsap.delayedCall(swap_at, () =>
        placeHandSprite(end.file, end.x, end.y, end.w, end.h, 0));
    }
    // erase / swipe / talk dispatch follow the same delayedCall pattern — omitted in this
    // first pass for brevity, mechanism is identical to the cases above.
  }

  // ── Boot ────────────────────────────────────────────────────────
  loadScene().then((scene) => {
    console.log(`scene loaded: ${scene.beats.length} beats`);
    buildCameraTimeline(scene.camera_keyframes);
    scene.beats.forEach(scheduleBeat);
  }).catch((err) => {
    // Loud, not silent — this exact failure mode (fetch of a file://
    // path failing silently) is what produced a blank first render.
    console.error('FATAL: scene failed to load:', err);
    document.body.innerHTML = `<div style="color:red;font-size:40px;padding:40px;">SCENE LOAD FAILED: ${err}</div>`;
  });
  </script>
</body>
</html>
